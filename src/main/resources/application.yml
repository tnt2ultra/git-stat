server:
  port: 8080

spring:
  application:
    name: git-stat

  datasource:
    url: jdbc:h2:file:./data/gitloc;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  h2:
    console:
      enabled: true
      path: /h2-console

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  git:
    storage-path: ./git-repos
    timeout-seconds: 600
    token: ${GITLAB_TOKEN:}
    allowed-host: ${GITLAB_ALLOWED_HOST:github.com}

logging:
  level:
    com.anri: INFO